name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # build 走的是 vinext（Vite），不做类型检查；tsc 单独跑一遍兜住类型回归
      - run: npm run typecheck
      - run: npm run build
